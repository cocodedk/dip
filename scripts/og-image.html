<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <title>Prøveklar delingsbillede</title>
    <style>
      @font-face { font-family: "DM Sans"; font-weight: 400; src: url("../node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-weight: 700; src: url("../node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2") format("woff2"); }

      body { margin: 0; width: 1200px; height: 630px; background: #163143; color: #f7f9fb; font-family: "DM Sans", sans-serif; }
      main { padding: 54px 68px; height: 100%; display: flex; flex-direction: column; }

      header img { width: 58px; height: 58px; }
      h1 { font-size: 66px; line-height: 1.12; letter-spacing: -2px; margin: 44px 0 18px; font-weight: 700; }

      .credit { color: #cad6df; font-size: 17px; line-height: 1.6; text-align: right; }

  <body>
    <main>
      <header><img src="../public/icon.svg" alt="" width="58" height="58" />Prøveklar</header>
      <h1><span>Indfødsretsprøven</span><span>Øv dig med tidligere prøver.</span></h1>

      <footer>
        <span class="domain">dip.cocode.dk</span>
        <span class="credit">Lavet af Babak Bandpey · linkedin.com/in/babakbandpey<br />© 2026 Cocode · cocode.dk</span>
