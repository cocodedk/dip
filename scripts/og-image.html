<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <title>Prøveklar delingsbillede</title>
    <style>
      @font-face { font-family: "DM Sans"; font-weight: 400; src: url("../node_modules/@fontsource/dm-sans/files/dm-sans-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "DM Sans"; font-weight: 700; src: url("../node_modules/@fontsource/dm-sans/files/dm-sans-latin-700-normal.woff2") format("woff2"); }
      * { box-sizing: border-box; }
      body { margin: 0; width: 1200px; height: 630px; background: #163143; color: #f7f9fb; font-family: "DM Sans", sans-serif; }
      main { height: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 42px 48px 32px; }
      header { display: flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 700; line-height: 1; }
      header img { width: 46px; height: 46px; }
      h1 { font-size: 58px; line-height: 1.16; letter-spacing: -1.6px; margin: 35px 0 24px; font-weight: 700; }
      h1 span { display: block; }
      .answers { display: flex; gap: 17px; align-items: center; margin-bottom: 24px; }
      .answers span { width: 47px; height: 47px; border: 2px solid #7995a6; border-radius: 50%; display: grid; place-items: center; font-size: 23px; font-weight: 700; color: #b5c9d4; }
      .answers .chosen { background: #e2f1eb; border-color: #e2f1eb; color: #11786e; }
      .description { margin: 0; font-size: 29px; line-height: 1.45; color: #f7f9fb; }
      .archive { margin: 8px 0 0; font-size: 24px; line-height: 1.45; color: #b5c9d4; }
      footer { margin-top: auto; font-size: 21px; line-height: 1.45; color: #b5c9d4; }
      footer strong { display: block; color: #f7f9fb; font-weight: 700; font-size: 25px; margin-bottom: 5px; }
    </style>
  </head>
  <body>
    <main>
      <header><img src="../public/icon.svg" alt="" width="46" height="46" />Prøveklar</header>
      <h1><span>Øv dig til</span><span>indfødsretsprøven.</span></h1>
      <div class="answers" aria-hidden="true"><span>A</span><span class="chosen">B</span><span>C</span></div>
      <p class="description">570 arkivspørgsmål. 13 tidligere prøver.</p>
      <p class="archive">2020–2026 · Gratis · Også offline</p>
      <footer><strong>dip.cocode.dk</strong>Lavet af Babak Bandpey · Cocode</footer>
    </main>
  </body>
</html>
